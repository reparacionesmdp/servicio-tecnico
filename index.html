    <!-- =====================================================
         CONFIGURACIÓN
    ====================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Martín Pulcini Reparaciones. Servicio técnico en Mar del Plata especializado en microondas, hornos eléctricos, equipos de audio y reproductores.">

    <meta name="keywords"
          content="servicio técnico Mar del Plata, reparación microondas, reparación hornos eléctricos, reparación equipos de audio, reparación parlantes">

    <meta name="author"
          content="Martín Pulcini Reparaciones">


    <!-- =====================================================
         OPEN GRAPH
    ====================================================== -->

    <meta property="og:title"
          content="Martín Pulcini Reparaciones">

    <meta property="og:description"
          content="Servicio técnico de microondas, hornos eléctricos y equipos de audio en Mar del Plata.">

    <meta property="og:type"
          content="website">

    <meta property="og:url"
          content="https://www.reparacionesmdp.com.ar">

    <meta property="og:image"
          content="https://www.reparacionesmdp.com.ar/imagen/og-image.jpg">


    <!-- =====================================================
         TÍTULO
    ====================================================== -->

    <title>
        Servicio Técnico Mar del Plata | Martín Pulcini Reparaciones
    </title>


    <!-- =====================================================
         CSS PRINCIPAL
    ====================================================== -->

    <link rel="stylesheet" href="estilos.css">


    <!-- =====================================================
         ESTILOS
    ====================================================== -->

    <style>

        /* =====================================================
           CORRECCIÓN DE LA LÍNEA VERTICAL IZQUIERDA
        ====================================================== */

        html,
        body {
            border-left: none !important;
        }

        body::before,
        body::after {
            display: none !important;
            content: none !important;
            border-left: none !important;
        }

        header::before,
        header::after,
        main::before,
        main::after,
        footer::before,
        footer::after {
            display: none !important;
            content: none !important;
        }


        /* =====================================================
           MENÚ LATERAL
        ====================================================== */

        .menu-btn {

            position: fixed;

            top: 18px;
            left: 18px;

            width: 52px;
            height: 52px;

            background: #1a1a1a;

            border: 2px solid #86c232;

            border-radius: 12px;

            color: #86c232;

            font-size: 27px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            z-index: 2001;

            box-shadow:
                0 0 15px rgba(134,194,50,.25);

            transition: .3s;
        }


        .menu-btn:hover {

            background: #86c232;

            color: #111;

            box-shadow:
                0 0 25px #86c232;
        }


        /* =====================================================
           MENÚ DESPLEGABLE
        ====================================================== */

        .menu-lateral {

            position: fixed;

            top: 0;
            left: -310px;

            width: 290px;

            height: 100vh;

            background: #111;

            border-right: 2px solid #86c232;

            box-shadow:
                5px 0 25px rgba(0,0,0,.6);

            z-index: 2000;

            padding: 85px 20px 25px;

            transition:
                left .35s ease;

            overflow-y: auto;
        }


        .menu-lateral.abierto {

            left: 0;
        }


        .menu-titulo {

            color: #86c232;

            text-align: center;

            font-size: 21px;

            font-weight: bold;

            margin-bottom: 25px;

            text-shadow:
                0 0 10px rgba(134,194,50,.3);
        }


        .menu-subtitulo {

            color: #777;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin:
                20px 5px 8px;
        }


        .menu-enlace {

            display: flex;

            align-items: center;

            gap: 12px;

            width: 100%;

            padding: 14px;

            margin-bottom: 10px;

            background: #1d1d1d;

            border: 1px solid #333;

            border-radius: 8px;

            color: #fff;

            text-decoration: none;

            font-weight: bold;

            transition: .25s;
        }


        .menu-enlace:hover {

            border-color: #86c232;

            color: #86c232;

            transform:
                translateX(4px);

            box-shadow:
                0 0 12px rgba(134,194,50,.2);
        }


        .menu-cerrar {

            position: absolute;

            top: 18px;
            right: 18px;

            background: transparent;

            border: none;

            color: #aaa;

            font-size: 25px;

            cursor: pointer;
        }


        .menu-cerrar:hover {

            color: #86c232;
        }


        /* =====================================================
           FONDO OSCURO DEL MENÚ
        ====================================================== */

        .menu-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.70);

            z-index: 1999;

            opacity: 0;

            pointer-events: none;

            transition: .3s;
        }


        .menu-overlay.activo {

            opacity: 1;

            pointer-events: auto;
        }


        /* =====================================================
           HEADER
        ====================================================== */

        .header-contenedor {

            position: relative;

            overflow: hidden;

            max-width: 1000px;

            margin:
                20px auto 45px;

            padding:
                45px 25px;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #241052,
                    #101d49
                );

            border:
                1px solid #08cbea;

            border-radius: 18px;

            box-shadow:
                0 0 25px
                rgba(0,207,255,.16);
        }


        .header-contenedor::before {

            display: none !important;

        }


        .logo-sitio img {

            width: 220px;

            max-width: 65vw;

            height: auto;

            display: block;

            margin:
                0 auto 25px;

            filter:
                drop-shadow(
                    0 0 18px
                    rgba(0,220,255,.35)
                );
        }


        .header-contenedor h1 {

            margin:
                10px 0 20px;

            font-size:
                clamp(34px, 7vw, 58px);

            line-height:
                1.05;

            color: #08d9ff;

            text-shadow:
                0 0 12px
                rgba(0,217,255,.45);
        }


        .header-contenedor p {

            max-width: 800px;

            margin:
                0 auto;

            color: #ccc;

            font-size: 19px;

            line-height: 1.7;
        }


        /* =====================================================
           BIENVENIDA / SERVICIO PROFESIONAL
        ====================================================== */

        .bienvenida {

            position: relative;

            max-width: 900px;

            margin:
                40px auto;

            padding:
                35px 35px 25px;

            background:
                linear-gradient(
                    145deg,
                    #181818,
                    #101010
                );

            border:
                2px solid #86c232;

            border-radius: 18px;

            box-shadow:
                0 0 25px
                rgba(134,194,50,.14);

            overflow: hidden;
        }


        .bienvenida-contenido {

            display: grid;

            grid-template-columns:
                150px 1fr;

            gap: 30px;

            align-items: center;
        }


        .icono-profesional {

            width: 120px;
            height: 120px;

            margin: auto;

            border:
                2px solid #86c232;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 58px;

            background:
                radial-gradient(
                    circle,
                    #202d18,
                    #101010
                );

            box-shadow:
                0 0 20px
                rgba(134,194,50,.30);
        }


        .bienvenida h2 {

            margin:
                0 0 15px;

            color: #fff;

            font-size:
                clamp(25px, 5vw, 34px);

            line-height: 1.15;
        }


        .bienvenida h2 span {

            color: #86c232;

            display: block;

            margin-top: 4px;
        }


        .bienvenida p {

            color: #ccc;

            line-height: 1.7;

            margin: 0;

            font-size: 16px;
        }


        /* =====================================================
           INDICADORES
        ====================================================== */

        .beneficios {

            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            margin-top: 30px;

            padding-top: 22px;

            border-top:
                1px solid #292929;
        }


        .beneficio {

            text-align: center;

            padding:
                5px 15px;

            border-right:
                1px solid #333;
        }


        .beneficio:last-child {

            border-right:
                none;
        }


        .beneficio-icono {

            display: block;

            color: #86c232;

            font-size: 28px;

            margin-bottom: 7px;
        }


        .beneficio strong {

            display: block;

            color: #fff;

            font-size: 14px;
        }


        .beneficio span {

            color: #888;

            font-size: 12px;
        }


        /* =====================================================
           SERVICIOS
        ====================================================== */

        .servicios-titulo {

            text-align: center;

            color: #86c232;

            margin:
                55px 0 25px;

            font-size: 32px;

            text-shadow:
                0 0 10px
                rgba(134,194,50,.25);
        }


        .grid-servicios {

            max-width: 1000px;

            margin:
                25px auto 50px;

            display: grid;

            grid-template-columns:
                repeat(auto-fit,minmax(210px,1fr));

            gap: 18px;

            padding:
                0 15px;
        }


        .tarjeta {

            background:
                linear-gradient(
                    145deg,
                    #191919,
                    #111
                );

            border:
                1px solid #333;

            border-radius: 12px;

            padding: 24px 18px;

            text-align: center;

            transition: .3s;
        }


        .tarjeta:hover {

            transform:
                translateY(-5px);

            border-color:
                #86c232;

            box-shadow:
                0 0 18px
                rgba(134,194,50,.18);
        }


        .tarjeta h3 {

            color: #fff;

            margin-top: 0;

            font-size: 19px;
        }


        .tarjeta p {

            color: #aaa;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 0;
        }


        /* =====================================================
           EQUIPO EN VENTA
        ====================================================== */

        .venta {

            max-width: 850px;

            margin:
                45px auto;

            padding:
                30px;

            background:
                linear-gradient(
                    145deg,
                    #191919,
                    #101010
                );

            border:
                2px solid #86c232;

            border-radius: 14px;

            text-align: center;

            box-shadow:
                0 0 20px
                rgba(134,194,50,.15);
        }


        .venta h2 {

            color: #86c232;

            margin-top: 0;
        }


        .venta p {

            color: #ccc;

            line-height: 1.6;
        }


        .boton-instagram {

            display: inline-block;

            margin-top: 15px;

            padding:
                13px 24px;

            background:
                #1d1d1d;

            border:
                2px solid #86c232;

            border-radius: 8px;

            color: #86c232;

            text-decoration: none;

            font-weight: bold;

            transition: .3s;
        }


        .boton-instagram:hover {

            background:
                #86c232;

            color: #111;

            box-shadow:
                0 0 18px #86c232;
        }


        /* =====================================================
           WHATSAPP
        ====================================================== */

        .whatsapp-btn {

            position: fixed;

            bottom: 20px;

            right: 20px;

            width: 62px;

            height: 62px;

            background:
                #25d366;

            color: white;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 0 15px #25d366;

            text-decoration: none;

            z-index: 1000;

            transition: .3s;
        }


        .whatsapp-btn:hover {

            transform:
                scale(1.1);

            box-shadow:
                0 0 28px #25d366;
        }


        /* =====================================================
           FOOTER
        ====================================================== */

        footer {

            text-align: center;

            padding:
                30px 20px;

            margin-top:
                60px;

            border-top:
                1px solid #333;
        }


        footer p {

            color: #666;

            font-size: 13px;
        }


        footer a {

            color: #86c232;

            text-decoration: none;

            font-weight: bold;
        }


        /* =====================================================
           CELULAR
        ====================================================== */

        @media (max-width:600px) {


            .menu-btn {

                width: 48px;

                height: 48px;

                font-size: 24px;

                top: 18px;

                left: 18px;
            }


            .header-contenedor {

                margin:
                    10px 10px 35px;

                padding:
                    38px 18px 30px;
            }


            .logo-sitio img {

                width: 190px;

                margin-bottom: 20px;
            }


            .header-contenedor h1 {

                font-size: 40px;

                line-height: 1.05;
            }


            .header-contenedor p {

                font-size: 16px;

                line-height: 1.65;
            }


            .bienvenida {

                margin:
                    25px 12px;

                padding:
                    28px 18px 20px;
            }


            .bienvenida-contenido {

                display: block;

                text-align: center;
            }


            .icono-profesional {

                width: 95px;

                height: 95px;

                font-size: 45px;

                margin-bottom: 22px;
            }


            .bienvenida h2 {

                font-size: 28px;
            }


            .bienvenida p {

                font-size: 15px;
            }


            .beneficios {

                grid-template-columns:
                    repeat(3,1fr);

                margin-top: 25px;

                padding-top: 18px;
            }


            .beneficio {

                padding:
                    4px 6px;
            }


            .beneficio-icono {

                font-size: 23px;
            }


            .beneficio strong {

                font-size: 11px;
            }


            .beneficio span {

                font-size: 10px;
            }


            .servicios-titulo {

                font-size: 28px;

                margin-top: 45px;
            }


            .grid-servicios {

                grid-template-columns:
                    repeat(2,1fr);

                gap: 12px;

                padding:
                    0 12px;
            }


            .tarjeta {

                padding:
                    20px 12px;
            }


            .tarjeta h3 {

                font-size: 16px;
            }


            .tarjeta p {

                font-size: 13px;
            }


            .venta {

                margin:
                    30px 12px;

                padding:
                    25px 18px;
            }


            .menu-lateral {

                width: 285px;
            }


            .whatsapp-btn {

                width: 58px;

                height: 58px;

                bottom: 18px;

                right: 18px;
            }

        }


        /* =====================================================
           CELULAR MUY PEQUEÑO
        ====================================================== */

        @media (max-width:380px) {

            .grid-servicios {

                grid-template-columns:
                    1fr;
            }


            .header-contenedor h1 {

                font-size: 34px;
            }


            .beneficio strong {

                font-size: 10px;
            }

        }

    </style>

</head>


<body>

     BOTÓN DEL MENÚ
===================================================== -->

<button
    id="abrirMenu"
    class="menu-btn"
    aria-label="Abrir menú">

    ☰

</button>



<!-- =====================================================
     FONDO OSCURO
===================================================== -->

<div
    id="menuOverlay"
    class="menu-overlay">
</div>
