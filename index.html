<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Retiros - Reparaciones MDP</title>
    <style>
        /* Estilos Cyberpunk alineados con tu web */
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1f2833;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            border: 1px solid #45f3ff;
        }
        h2 {
            color: #45f3ff;
            text-align: center;
            margin-top: 0;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #0b0c10;
            border: 1px solid #c5c6c7;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #45f3ff;
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.5);
        }
        .result-card {
            background: #0b0c10;
            border-left: 4px solid #45f3ff;
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
            display: none;
        }
        .price {
            font-size: 24px;
            color: #45f3ff;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .info-nota {
            font-size: 13px;
            color: #86c232;
            line-height: 1.4;
            margin-top: 5px;
            border-top: 1px dashed rgba(134, 194, 50, 0.3);
            padding-top: 5px;
        }
        .btn-whatsapp {
            display: none;
            width: 100%;
            background: #25d366;
            color: #fff;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }
        .btn-whatsapp:hover {
            background: #128c7e;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Consulta Costo de Retiro 🚚</h2>
    
    <div class="search-box">
        <input type="text" id="inputBarrio" placeholder="Escribí tu barrio (ej: Centro, Alfar...)" oninput="buscarPrecio()">
    </div>

    <div id="tarjetaResultado" class="result-card">
        <div id="textoBarrio" style="font-weight: bold; color: #fff;"></div>
        <div id="precioValor" class="price"></div>
        <div class="info-nota">⚠️ **Nota importante:** El costo del retiro incluye la elaboración del presupuesto y el reenvío del equipo a tu domicilio, incluso si decidís no aceptar el presupuesto final.</div>
    </div>

    <a id="btnConsultar" href="#" target="_blank" class="btn-whatsapp">
        Coordinar Retiro por WhatsApp 💬
    </a>
</div>

<script>
    // Base de datos de precios reales actualizada para Mar del Plata
    const preciosBarrios = {
        "centro": 5000,
        "parque luro": 5000,
        "san jose": 5000,
        "don bosco": 5000,
        "villa primera": 5000,
        "la perla": 7000,
        "libertad": 7000,
        "los troncos": 10000,
        "constitucion": 10000,
        "alfar": 10000
    };

    function buscarPrecio() {
        const input = document.getElementById("inputBarrio").value.toLowerCase().trim();
        const tarjeta = document.getElementById("tarjetaResultado");
        const boton = document.getElementById("btnConsultar");
        const textoBarrio = document.getElementById("textoBarrio");
        const precioValor = document.getElementById("precioValor");

        // Si el buscador está vacío, ocultamos todo
        if (input === "") {
            tarjeta.style.display = "none";
            boton.style.display = "none";
            return;
        }

        // Buscamos si el barrio ingresado existe en nuestra lista
        if (preciosBarrios.hasOwnProperty(input)) {
            // Caso 1: El barrio tiene tarifa fija
            textoBarrio.textContent = "Costo de Retiro para Barrio " + input.toUpperCase() + ":";
            precioValor.textContent = "$" + preciosBarrios[input].toLocaleString('es-AR');
            
            tarjeta.style.display = "block";
            boton.style.display = "none";
        } else {
            // Caso 2: El barrio no está en la lista (Zonas especiales o a consultar)
            tarjeta.style.display = "none";
            
            // Creamos un mensaje personalizado para WhatsApp
            const mensajeWa = encodeURIComponent("Hola! Quisiera consultar por un retiro a domicilio para el barrio: " + input.toUpperCase());
            boton.href = "https://wa.me/5492234373563text=" + mensajeWa; // Recordá cambiar las 'x' por tu número real
            boton.style.display = "block";
        }
    }
</script>

</body>
</html>
