    <style>

        /* =====================================================
           RESET GENERAL
        ====================================================== */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            min-height: 100%;
            border: none !important;
        }


        body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #17172d 0%,
                    #0c0c12 45%,
                    #08080c 100%
                );

            color: #fff;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            border: none !important;
            outline: none !important;

            overflow-x: hidden;
        }


        /* Elimina posibles líneas decorativas
           provenientes de estilos anteriores */

        body::before,
        body::after,
        main::before,
        main::after,
        header::before,
        header::after,
        footer::before,
        footer::after {
            display: none !important;
            content: none !important;
            border: none !important;
        }


        a {
            -webkit-tap-highlight-color: transparent;
        }


        /* =====================================================
           BOTÓN DEL MENÚ
        ====================================================== */

        .menu-btn {

            position: fixed;

            top: 18px;
            left: 18px;

            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #151515;

            border: 2px solid #86c232;

            border-radius: 12px;

            color: #86c232;

            font-size: 28px;

            line-height: 1;

            cursor: pointer;

            z-index: 3001;

            box-shadow:
                0 0 18px rgba(134,194,50,.25);

            transition:
                .25s ease;
        }


        .menu-btn:hover {
            background: #86c232;
            color: #111;

            box-shadow:
                0 0 25px rgba(134,194,50,.65);
        }


        /* =====================================================
           MENÚ LATERAL
        ====================================================== */

        .menu-lateral {

            position: fixed;

            top: 0;
            left: -310px;

            width: 290px;
            height: 100vh;

            padding:
                85px 20px 25px;

            background:
                linear-gradient(
                    180deg,
                    #151515,
                    #0c0c0c
                );

            border-right:
                2px solid #86c232;

            box-shadow:
                8px 0 30px rgba(0,0,0,.7);

            z-index: 3000;

            overflow-y: auto;

            transition:
                left .35s ease;
        }


        .menu-lateral.abierto {
            left: 0;
        }


        .menu-titulo {

            text-align: center;

            color: #86c232;

            font-size: 21px;

            font-weight: 700;

            line-height: 1.35;

            margin-bottom: 28px;

            text-shadow:
                0 0 10px rgba(134,194,50,.25);
        }


        .menu-subtitulo {

            margin:
                22px 5px 9px;

            color: #777;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        .menu-enlace {

            display: flex;

            align-items: center;

            gap: 12px;

            width: 100%;

            padding: 14px;

            margin-bottom: 10px;

            background: #191919;

            border:
                1px solid #303030;

            border-radius: 9px;

            color: #fff;

            text-decoration: none;

            font-weight: 600;

            transition:
                .25s ease;
        }


        .menu-enlace:hover {

            color: #86c232;

            border-color: #86c232;

            transform:
                translateX(4px);

            box-shadow:
                0 0 14px
                rgba(134,194,50,.18);
        }


        .menu-cerrar {

            position: absolute;

            top: 18px;
            right: 18px;

            width: 38px;
            height: 38px;

            background: transparent;

            border: none;

            color: #999;

            font-size: 25px;

            cursor: pointer;
        }


        .menu-cerrar:hover {
            color: #86c232;
        }


        /* =====================================================
           OVERLAY
        ====================================================== */

        .menu-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.72);

            z-index: 2999;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .3s ease;
        }


        .menu-overlay.activo {

            opacity: 1;

            pointer-events: auto;
        }


        /* =====================================================
           HEADER
        ====================================================== */

        .header-contenedor {

            width: calc(100% - 30px);

            max-width: 1000px;

            margin:
                20px auto 45px;

            padding:
                45px 25px;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #241052,
                    #101d49
                );

            border:
                1px solid #08cbea;

            border-radius: 18px;

            box-shadow:
                0 0 28px
                rgba(0,207,255,.16);
        }


        .logo-sitio img {

            display: block;

            width: 220px;

            max-width: 65vw;

            height: auto;

            margin:
                0 auto 25px;

            filter:
                drop-shadow(
                    0 0 18px
                    rgba(0,220,255,.35)
                );
        }


        .header-contenedor h1 {

            margin:
                10px 0 20px;

            color: #08d9ff;

            font-size:
                clamp(34px,7vw,58px);

            line-height: 1.05;

            text-shadow:
                0 0 12px
                rgba(0,217,255,.45);
        }


        .header-contenedor p {

            max-width: 800px;

            margin: 0 auto;

            color: #ccc;

            font-size: 19px;

            line-height: 1.7;
        }


        /* =====================================================
           CONTENIDO
        ====================================================== */

        main {

            width: 100%;

            margin: 0;

            padding: 0 0 30px;
        }


        /* =====================================================
           BIENVENIDA
        ====================================================== */

        .bienvenida {

            width:
                calc(100% - 30px);

            max-width: 900px;

            margin:
                40px auto;

            padding:
                35px;

            background:
                linear-gradient(
                    145deg,
                    #181818,
                    #101010
                );

            border:
                2px solid #86c232;

            border-radius: 18px;

            box-shadow:
                0 0 25px
                rgba(134,194,50,.14);
        }


        .bienvenida-contenido {

            display: grid;

            grid-template-columns:
                140px 1fr;

            gap: 30px;

            align-items: center;
        }


        .icono-profesional {

            width: 115px;
            height: 115px;

            margin: auto;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle,
                    #202d18,
                    #101010
                );

            border:
                2px solid #86c232;

            border-radius: 50%;

            font-size: 55px;

            box-shadow:
                0 0 20px
                rgba(134,194,50,.28);
        }


        .bienvenida h2 {

            margin:
                0 0 15px;

            color: #fff;

            font-size:
                clamp(25px,5vw,34px);

            line-height: 1.15;
        }


        .bienvenida h2 span {

            display: block;

            margin-top: 4px;

            color: #86c232;
        }


        .bienvenida p {

            margin: 0;

            color: #ccc;

            font-size: 16px;

            line-height: 1.7;
        }


        /* =====================================================
           BENEFICIOS
        ====================================================== */

        .beneficios {

            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            margin-top: 30px;

            padding-top: 22px;

            border-top:
                1px solid #292929;
        }


        .beneficio {

            padding:
                5px 15px;

            text-align: center;

            border-right:
                1px solid #333;
        }


        .beneficio:last-child {
            border-right: none;
        }


        .beneficio-icono {

            display: block;

            margin-bottom: 7px;

            color: #86c232;

            font-size: 28px;
        }


        .beneficio strong {

            display: block;

            color: #fff;

            font-size: 14px;
        }


        .beneficio span:last-child {

            color: #888;

            font-size: 12px;
        }


        /* =====================================================
           SERVICIOS
        ====================================================== */

        .servicios-titulo {

            margin:
                55px 0 25px;

            text-align: center;

            color: #86c232;

            font-size: 32px;

            text-shadow:
                0 0 10px
                rgba(134,194,50,.25);
        }


        .grid-servicios {

            width:
                calc(100% - 30px);

            max-width: 1000px;

            margin:
                25px auto 50px;

            display: grid;

            grid-template-columns:
                repeat(4,1fr);

            gap: 18px;
        }


        .tarjeta {

            padding:
                24px 18px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #191919,
                    #111
                );

            border:
                1px solid #333;

            border-radius: 12px;

            transition:
                .3s ease;
        }


        .tarjeta:hover {

            transform:
                translateY(-5px);

            border-color:
                #86c232;

            box-shadow:
                0 0 18px
                rgba(134,194,50,.18);
        }


        .tarjeta h3 {

            margin:
                0 0 12px;

            color: #fff;

            font-size: 19px;
        }


        .tarjeta p {

            margin: 0;

            color: #aaa;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =====================================================
           EQUIPO EN VENTA
        ====================================================== */

        .venta {

            width:
                calc(100% - 30px);

            max-width: 850px;

            margin:
                45px auto;

            padding:
                30px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #191919,
                    #101010
                );

            border:
                2px solid #86c232;

            border-radius: 14px;

            box-shadow:
                0 0 20px
                rgba(134,194,50,.15);
        }


        .venta h2 {

            margin:
                0 0 15px;

            color: #86c232;
        }


        .venta p {

            color: #ccc;

            line-height: 1.6;
        }


        .boton-instagram {

            display: inline-block;

            margin-top: 15px;

            padding:
                13px 24px;

            background: #1d1d1d;

            border:
                2px solid #86c232;

            border-radius: 8px;

            color: #86c232;

            text-decoration: none;

            font-weight: bold;

            transition:
                .3s ease;
        }


        .boton-instagram:hover {

            background: #86c232;

            color: #111;

            box-shadow:
                0 0 18px #86c232;
        }


        /* =====================================================
           WHATSAPP
        ====================================================== */

        .whatsapp-btn {

            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 62px;
            height: 62px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #25d366;

            border-radius: 50%;

            box-shadow:
                0 0 15px #25d366;

            text-decoration: none;

            z-index: 2000;

            transition:
                .3s ease;
        }


        .whatsapp-btn:hover {

            transform:
                scale(1.1);

            box-shadow:
                0 0 28px #25d366;
        }


        /* =====================================================
           FOOTER
        ====================================================== */

        footer {

            width: 100%;

            padding:
                30px 20px;

            margin-top:
                60px;

            text-align: center;

            border-top:
                1px solid #292929;
        }


        footer p {

            margin:
                0 0 10px;

            color: #666;

            font-size: 13px;
        }


        footer a {

            color: #86c232;

            text-decoration: none;

            font-weight: bold;
        }
