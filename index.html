    <link rel="stylesheet" href="estilos.css">

    <style>
        /* =====================================================
           VARIABLES GLOBALES Y RESET BÁSICO
        ===================================================== */
        :root {
            --color-fondo: #0b0d0a;
            --color-superficie: #14170f;
            --color-superficie-2: #191d13;
            --color-borde: #2a3020;
            --color-principal: #8bc24a;
            --color-principal-oscuro: #5f8f2c;
            --color-acento: #e0a458;
            --color-texto: #edeee7;
            --color-texto-secundario: #a6ab9c;
            --color-texto-tenue: #6f7568;
            --fuente-display: 'Space Grotesk', 'Inter', sans-serif;
            --fuente-cuerpo: 'Inter', sans-serif;
            --fuente-mono: 'IBM Plex Mono', monospace;
            --transition-base: 0.25s ease;
            --radio: 10px;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            background: var(--color-fondo);
            color: var(--color-texto);
            font-family: var(--fuente-cuerpo);
            margin: 0;
        }

        body.menu-abierto { overflow: hidden; }

        a { color: inherit; }

        .visually-hidden {
            position: absolute;
            width: 1px; height: 1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--color-principal);
            outline-offset: 3px;
        }

        .eyebrow {
            font-family: var(--fuente-mono);
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--color-principal);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .eyebrow::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--color-principal);
            box-shadow: 0 0 0 3px rgba(139, 194, 74, 0.18);
        }

        /* =====================================================
           BARRA SUPERIOR / NAV
        ===================================================== */
        .barra-superior {
            position: sticky;
            top: 0;
            z-index: 1500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: rgba(11, 13, 10, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--color-borde);
        }

        .marca-barra {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--fuente-display);
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            color: var(--color-texto);
        }

        .marca-barra img { height: 30px; width: auto; }

        .nav-escritorio {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-escritorio a {
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            color: var(--color-texto-secundario);
            padding: 9px 14px;
            border-radius: 8px;
            transition: var(--transition-base);
        }

        .nav-escritorio a:hover {
            color: var(--color-texto);
            background: var(--color-superficie);
        }

        .nav-escritorio .cta-nav {
            margin-left: 6px;
            background: var(--color-principal);
            color: #0d1207;
            font-weight: 600;
        }

        .nav-escritorio .cta-nav:hover {
            background: #9fd465;
            color: #0d1207;
        }

        .menu-btn {
            display: none;
            width: 44px;
            height: 44px;
            background: var(--color-superficie);
            border: 1px solid var(--color-borde);
            border-radius: 8px;
            color: var(--color-principal);
            font-size: 22px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-base);
        }

        .menu-btn:hover {
            border-color: var(--color-principal);
        }

        @media (max-width: 780px) {
            .nav-escritorio { display: none; }
            .menu-btn { display: flex; }
        }

        /* =====================================================
           MENÚ LATERAL (MÓVIL)
        ===================================================== */
        .menu-lateral {
            position: fixed;
            top: 0;
            left: -310px;
            width: 290px;
            height: 100vh;
            background: var(--color-fondo);
            border-right: 1px solid var(--color-borde);
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.6);
            z-index: 2000;
            padding: 22px 20px 25px;
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        .menu-lateral.abierto { left: 0; }

        .menu-encabezado {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .menu-titulo {
            font-family: var(--fuente-display);
            color: var(--color-principal);
            font-size: 17px;
            font-weight: 600;
        }

        .menu-subtitulo {
            color: var(--color-texto-tenue);
            font-family: var(--fuente-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 22px 5px 8px;
        }

        .menu-enlace {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 8px;
            background: var(--color-superficie);
            border: 1px solid var(--color-borde);
            border-radius: 8px;
            color: var(--color-texto);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: var(--transition-base);
        }

        .menu-enlace:hover {
            border-color: var(--color-principal);
            color: var(--color-principal);
        }

        .menu-cerrar {
            background: transparent;
            border: none;
            color: var(--color-texto-secundario);
            font-size: 22px;
            cursor: pointer;
        }

        .menu-cerrar:hover { color: var(--color-principal); }

        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1999;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-base);
        }

        .menu-overlay.activo {
            opacity: 1;
            pointer-events: auto;
        }

        /* =====================================================
           HERO
        ===================================================== */
        .hero {
            max-width: 1120px;
            margin: 0 auto;
            padding: 64px 24px 40px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 40px;
            align-items: center;
        }

        .hero-texto h1 {
            font-family: var(--fuente-display);
            font-size: 40px;
            line-height: 1.15;
            margin: 14px 0 16px;
            font-weight: 700;
        }

        .hero-texto p.hero-descripcion {
            color: var(--color-texto-secundario);
            font-size: 16px;
            line-height: 1.7;
            max-width: 480px;
            margin: 0 0 26px;
        }

        .hero-acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .boton {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 22px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: var(--transition-base);
            border: 1px solid transparent;
        }

        .boton-primario {
            background: var(--color-principal);
            color: #0d1207;
        }

        .boton-primario:hover {
            background: #9fd465;
            box-shadow: 0 0 0 4px rgba(139, 194, 74, 0.14);
        }

        .boton-secundario {
            background: transparent;
            border-color: var(--color-borde);
            color: var(--color-texto);
        }

        .boton-secundario:hover {
            border-color: var(--color-principal);
            color: var(--color-principal);
        }

        .hero-sellos {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid var(--color-borde);
        }

        .sello {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--color-texto-secundario);
        }

        .sello svg { flex-shrink: 0; color: var(--color-principal); }

        /* Panel diagnóstico (elemento visual distintivo) */
        .panel-diagnostico {
            background: var(--color-superficie);
            border: 1px solid var(--color-borde);
            border-radius: 14px;
            padding: 22px;
        }

        .panel-encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .panel-encabezado .eyebrow::before { animation: parpadeo 2s infinite ease-in-out; }

        @keyframes parpadeo {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        .panel-linea {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--color-borde);
            font-size: 13px;
        }

        .panel-linea:last-child { border-bottom: none; }

        .panel-linea span:first-child { color: var(--color-texto-tenue); font-family: var(--fuente-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }

        .panel-linea span:last-child { color: var(--color-texto); font-weight: 500; }

        .estado-ok {
            color: var(--color-principal) !important;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 860px) {
            .hero { grid-template-columns: 1fr; padding-top: 40px; }
            .hero-texto h1 { font-size: 32px; }
        }

        /* =====================================================
           SECCIONES GENERALES
        ===================================================== */
        section { max-width: 1120px; margin: 0 auto; padding: 50px 24px; }

        .encabezado-seccion { text-align: center; max-width: 620px; margin: 0 auto 36px; }

        .encabezado-seccion .eyebrow { justify-content: center; margin-bottom: 12px; }

        .encabezado-seccion h2 {
            font-family: var(--fuente-display);
            font-size: 28px;
            margin: 0 0 10px;
        }

        .encabezado-seccion p {
            color: var(--color-texto-secundario);
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
        }

        /* =====================================================
           SERVICIOS
        ===================================================== */
        .grid-servicios {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px;
        }

        .tarjeta {
            background: var(--color-superficie);
            border: 1px solid var(--color-borde);
            border-radius: var(--radio);
            padding: 24px;
            transition: var(--transition-base);
        }

        .tarjeta:hover {
            border-color: var(--color-principal);
            transform: translateY(-3px);
        }

        .tarjeta-icono {
            width: 42px;
            height: 42px;
            border-radius: 9px;
            background: rgba(139, 194, 74, 0.12);
            color: var(--color-principal);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .tarjeta .tarjeta-eyebrow {
            font-family: var(--fuente-mono);
            font-size: 11px;
            color: var(--color-texto-tenue);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
        }

        .tarjeta h3 {
            color: var(--color-texto);
            margin: 0 0 8px;
            font-family: var(--fuente-display);
            font-size: 17px;
        }

        .tarjeta p {
            color: var(--color-texto-secundario);
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        /* =====================================================
           POR QUÉ ELEGIRNOS
        ===================================================== */
        .franja-confianza {
            background: var(--color-superficie-2);
            border-top: 1px solid var(--color-borde);
            border-bottom: 1px solid var(--color-borde);
        }

        .grid-confianza {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 28px;
        }

        .item-confianza { display: flex; gap: 14px; align-items: flex-start; }

        .item-confianza .tarjeta-icono { flex-shrink: 0; margin-bottom: 0; }

        .item-confianza h3 {
            font-family: var(--fuente-display);
            font-size: 15px;
            margin: 0 0 6px;
            color: var(--color-texto);
        }

        .item-confianza p {
            font-size: 13px;
            color: var(--color-texto-secundario);
            line-height: 1.6;
            margin: 0;
        }

        /* =====================================================
           EQUIPO EN VENTA
        ===================================================== */
        .venta {
            background: var(--color-superficie);
            border: 1px solid var(--color-borde);
            border-radius: 14px;
            padding: 40px;
            text-align: center;
        }

        .venta .eyebrow { justify-content: center; margin-bottom: 14px; }

        .venta h2 {
            font-family: var(--fuente-display);
            font-size: 24px;
            margin: 0 0 12px;
        }

        .venta p {
            color: var(--color-texto-secundario);
            line-height: 1.6;
            max-width: 480px;
            margin: 0 auto 22px;
        }

        .boton-instagram {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            background: transparent;
            border: 1px solid var(--color-principal);
            border-radius: 8px;
            color: var(--color-principal);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition-base);
        }

        .boton-instagram:hover {
            background: var(--color-principal);
            color: #0d1207;
        }

        /* =====================================================
           CONTACTO
        ===================================================== */
        .grid-contacto {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .tarjeta-contacto {
            background: var(--color-superficie);
            border: 1px solid var(--color-borde);
            border-radius: var(--radio);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .tarjeta-contacto h3 {
            font-family: var(--fuente-display);
            font-size: 16px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tarjeta-contacto p {
            color: var(--color-texto-secundario);
            font-size: 13px;
            line-height: 1.6;
            margin: 0;
        }

        .tarjeta-contacto .boton { align-self: flex-start; }

        /* =====================================================
           WHATSAPP FLOTANTE
        ===================================================== */
        .whatsapp-btn {
            position: fixed;
            bottom: 22px;
            right: 22px;
            width: 58px;
            height: 58px;
            background: #25d366;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 18px rgba(0,0,0,0.4);
            text-decoration: none;
            z-index: 1000;
            transition: var(--transition-base);
        }

        .whatsapp-btn:hover { transform: scale(1.08); }

        /* =====================================================
           FOOTER
        ===================================================== */
        footer {
            border-top: 1px solid var(--color-borde);
            padding: 30px 24px;
            margin-top: 30px;
        }

        .footer-contenido {
            max-width: 1120px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        footer p {
            color: var(--color-texto-tenue);
            font-size: 13px;
            margin: 0
